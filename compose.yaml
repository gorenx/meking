services:
  meking:
    build:
      context: .
    image: meking:local
    init: true
    user: "${MEKING_UID:-1000}:${MEKING_GID:-1000}"
    ports:
      - "127.0.0.1:${MEKING_PORT:-8080}:8080"
    volumes:
      - "${MEKING_PROJECT_ROOT:-./project-data}:/project"
    read_only: true
    tmpfs:
      - /tmp
    stop_grace_period: 15s
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/v1/zones', timeout=3).read()"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped
